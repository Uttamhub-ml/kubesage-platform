apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
spec:
  description: prod workloads - deploy repo only, *-prod namespaces only
  sourceRepos:
    - https://github.com/Uttamhub-ml/kubesage-deploy.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*-prod"
  clusterResourceWhitelist: []        # no Namespaces, CRDs, ClusterRoles
  namespaceResourceBlacklist:         # these belong to the platform team
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding