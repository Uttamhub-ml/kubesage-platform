apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Uttamhub-ml/kubesage-platform.git
    targetRevision: main
    path: clusters/lab/argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true                   # removing a file here removes that Application
      selfHeal: true