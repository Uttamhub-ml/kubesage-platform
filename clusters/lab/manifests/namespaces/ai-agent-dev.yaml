apiVersion: v1
kind: Namespace
metadata:
  name: ai-agent-dev
  labels:
    kubesage.io/env: dev
    kubesage.io/role: agent
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: ai-agent-dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ai-agent-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        memory: 512Mi